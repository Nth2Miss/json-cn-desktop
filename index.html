<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON助手 - json.cn 桌面版</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app" class="layout">
    <!-- 标题栏 可拖动 -->
    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar-left" data-tauri-drag-region>
        <span class="logo">Json.<b>cn</b> <small>桌面版</small></span>
        <span class="subtitle">JSON在线解析及格式化验证</span>
      </div>
      <div class="titlebar-right">
        <span class="status-dot" id="statusDot" title="就绪"></span>
        <span class="status-text" id="statusText">就绪</span>
      </div>
    </header>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar">
      <button class="btn-icon" id="btnOpen" title="打开文件 (Ctrl+O)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"/><path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0"/><path d="M12 12m-8 0a8 8 0 0 0 8 8"/></svg><span>打开</span></button>
      <div class="sep"></div>
      <button class="btn-icon" id="btnZip" title="压缩"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 4v8l-7 4l-7 -4v-8z"/><path d="M12 11l7 -4"/><path d="M12 11v8"/></svg><span>压缩</span></button>
      <button class="btn-icon" id="btnXml" title="转XML"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M5 12h14"/><path d="M5 16h14"/><path d="M5 8h14"/><path d="M14 3l6 6v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h7z"/></svg><span>转XML</span></button>
      <button class="btn-icon" id="btnShown" title="显示行号"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg><span>行号</span></button>
      <button class="btn-icon" id="btnClear" title="清空"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></svg><span>清空</span></button>
      <button class="btn-icon" id="btnSave" title="保存 (Ctrl+S)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M12 17a3 3 0 1 0 0 -6a3 3 0 0 0 0 6z"/><path d="M12 13v4"/></svg><span>保存</span></button>
      <button class="btn-icon" id="btnCopy" title="复制"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8v-2a2 2 0 0 0 -2 -2h-8a2 2 0 0 0 -2 2v8a2 2 0 0 0 2 2h2"/></svg><span>复制</span></button>
      <button class="btn-icon" id="btnCompress" title="折叠"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16"/><path d="M4 16h16"/><path d="M8 8v8"/><path d="M16 8v8"/></svg><span>折叠</span></button>
      <button class="btn-icon" id="btnExample" title="示例"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-4.4 -4.4l.7 .7m5.6 -11.3l.7 .7m-11.3 .7l.7 .7m11.3 5.6l.7 .7"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M12 21v-2"/><path d="M12 7v-2"/></svg><span>示例</span></button>
      <div class="sep"></div>
      <label class="check-label" title="保留转义字符">
        <input type="checkbox" id="cancelZY" checked />
        <span>保留转义</span>
      </label>
      <div class="spacer"></div>
      <button class="btn-icon" id="btnFullscreen" title="全屏 (F11)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4l4 0l0 4"/><path d="M14 10l6 -6"/><path d="M8 20l-4 0l0 -4"/><path d="M10 14l-6 6"/></svg><span>全屏</span></button>
      <button class="btn-icon" id="btnSettings" title="设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0 -6a3 3 0 0 0 0 6"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06 .06a2 2 0 1 1 -2.83 2.83l-.06 -.06a1.65 1.65 0 0 0 -1.82 -.33a1.65 1.65 0 0 0 -1 1.51v.17a2 2 0 0 1 -4 0v-.17a1.65 1.65 0 0 0 -1 -1.51a1.65 1.65 0 0 0 -1.82 .33l-.06 .06a2 2 0 1 1 -2.83 -2.83l.06 -.06a1.65 1.65 0 0 0 .33 -1.82a1.65 1.65 0 0 0 -1.51 -1h-.17a2 2 0 0 1 0 -4h.17a1.65 1.65 0 0 0 1.51 -1a1.65 1.65 0 0 0 -.33 -1.82l-.06 -.06a2 2 0 1 1 2.83 -2.83l.06 .06a1.65 1.65 0 0 0 1.82 .33h.17a1.65 1.65 0 0 0 1 -1.51v-.17a2 2 0 0 1 4 0v.17a1.65 1.65 0 0 0 1 1.51a1.65 1.65 0 0 0 1.82 -.33l.06 -.06a2 2 0 1 1 2.83 2.83l-.06 .06a1.65 1.65 0 0 0 -.33 1.82v.17a1.65 1.65 0 0 0 1.51 1h.17a2 2 0 0 1 0 4h-.17a1.65 1.65 0 0 0 -1.51 1z"/></svg><span>设置</span></button>
    </div>

    <!-- 主体左右分栏 -->
    <div class="main" id="dragParent">
      <!-- 左侧输入区 -->
      <div class="input-area" id="inputArea" style="width: 42%;">
        <div class="pane-header">
          <span>输入 JSON / XML</span>
          <span class="pane-hint" id="inputHint">支持拖拽文件到此处</span>
        </div>
        <div class="input-gap" id="jsonTxtAreaGap" style="display:none">
          <div id="line-numbers" class="textarea-lines"></div>
        </div>
        <div class="input-container" id="jsonTxtAreaContainer">
          <textarea id="json-src" class="json-src" placeholder='请输入 JSON 数据，例如：&#10;{&#10;  "name": "Tom",&#10;  "age": 18,&#10;  "tags": ["json", "format"]&#10;}' spellcheck="false"></textarea>
        </div>
        <div class="pane-footer">
          <span id="inputStats">0 字符</span>
          <span id="inputError" class="error-msg"></span>
        </div>
      </div>

      <!-- 拖动条 -->
      <div class="area-drag" id="dragEle" title="拖动调整宽度">
        <svg width="12" height="16" viewBox="0 0 24 24" fill="currentColor" opacity="0.3"><circle cx="9" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
      </div>

      <!-- 右侧格式化区 -->
      <div class="format-area" id="formatArea" style="width: 58%;">
        <div class="pane-header">
          <span>格式化视图</span>
          <span class="pane-hint" id="formatHint">可点击键值进行编辑</span>
        </div>
        <div class="bottom-format-area" id="jsonFormatArea">
          <div class="line-num-container" id="lineNumContainer" style="display:none">
            <div id="line-num" class="line-num"></div>
          </div>
          <div id="jsonFormatContainer" class="json-format-container">
            <div class="editable-tip" id="editableTip">在左侧输入 JSON，右侧实时预览 · 支持超大数字、XML 互转</div>
            <div id="json-target" class="json-target"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 底部状态 -->
    <footer class="statusbar">
      <span id="footerStatus">就绪 | 等待输入</span>
      <span class="footer-right">json.cn 桌面版 · Tauri 2 · 离线可用</span>
    </footer>
  </div>

  <!-- 设置弹窗 -->
  <div id="settingsModal" class="modal" style="display:none">
    <div class="modal-backdrop" id="settingsBackdrop"></div>
    <div class="modal-panel">
      <div class="modal-header">
        <h3>设置</h3>
        <button class="modal-close" id="settingsClose">×</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label class="setting-label">主题</label>
          <div class="setting-options" id="themeOptions">
            <label class="radio-card"><input type="radio" name="theme" value="light"><span>浅色</span></label>
            <label class="radio-card"><input type="radio" name="theme" value="dark"><span>深色</span></label>
            <label class="radio-card"><input type="radio" name="theme" value="system" checked><span>跟随系统</span></label>
          </div>
        </div>
        <div class="setting-group">
          <label class="setting-label">字体大小</label>
          <div class="setting-row">
            <input type="range" id="fontSizeRange" min="11" max="18" value="13" />
            <span id="fontSizeValue">13px</span>
          </div>
        </div>
        <div class="setting-group">
          <label class="setting-label">其他</label>
          <label class="check-label" style="padding:4px 0">
            <input type="checkbox" id="settingKeepEscape" checked />
            <span>默认保留转义（同工具栏）</span>
          </label>
        </div>
        <div class="setting-group muted">
          <p style="font-size:12px;line-height:1.6">
            JSON Assistant · 基于 <a href="https://www.json.cn" target="_blank" style="color:var(--primary)">json.cn</a> 逻辑离线重制<br/>
            快捷键：Ctrl+O 打开 · Ctrl+S 保存 · F11 全屏 · Esc 退出全屏
          </p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-icon" id="settingsConfirm">完成</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
